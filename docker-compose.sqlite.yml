services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: authentic-backend-sqlite
    restart: unless-stopped
    environment:
      PORT: 5151
      LOG_LEVEL: info
      DATABASE_DRIVER: sqlite
      SQLITE_PATH: /data/authentic.db
      # First-Time Setup: Leave unconfigured to create your custom admin credentials on initial web launch
      # ADMIN_EMAIL: admin@yourcompany.com
      # ADMIN_PASSWORD: your-secure-master-password
      PAYMENT_PROVIDERS_ENABLED: mock,cbe,telebirr,boa,dashen,awash,mpesa
      ALLOW_ORIGINS: "*"
      WORKER_CONCURRENCY: 3
      WORKER_POLL_INTERVAL: 3s
    volumes:
      - sqlite_data:/data
    ports:
      - "5151:5151"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: authentic-frontend-sqlite
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5152:80"

volumes:
  sqlite_data:
