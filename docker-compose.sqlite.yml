services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: paygate-backend-sqlite
    restart: unless-stopped
    environment:
      PORT: 8080
      LOG_LEVEL: info
      DATABASE_DRIVER: sqlite
      SQLITE_PATH: /data/paygate.db
      JWT_SECRET: super-secret-production-jwt-signing-key-minimum-32-bytes
      ADMIN_EMAIL: admin@paygate.dev
      ADMIN_PASSWORD: admin-password-change-me
      PAYMENT_PROVIDERS_ENABLED: mock,cbe,telebirr,boa
      ALLOW_ORIGINS: "*"
      WORKER_CONCURRENCY: 3
      WORKER_POLL_INTERVAL: 3s
    volumes:
      - sqlite_data:/data
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: paygate-frontend-sqlite
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  sqlite_data:
