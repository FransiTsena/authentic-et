name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  changes:
    name: Detect Changed Components
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      unified: ${{ steps.filter.outputs.unified }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Path Filter
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            unified:
              - 'Dockerfile'
              - 'docker-compose*.yml'
              - '.github/workflows/ci.yml'

  backend-test:
    name: Backend Tests & Lint
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.unified == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Go Format Check
        run: |
          cd backend
          test -z "$(gofmt -l .)"

      - name: Run Go Unit & Conformance Tests
        run: |
          cd backend
          go test -race -v -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Verify CLI & Server Binaries Build
        run: |
          cd backend
          go build -v -o /dev/null ./cmd/cli
          go build -v -o /dev/null ./cmd/server

  frontend-test:
    name: Frontend Build & Typecheck
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.unified == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run TypeScript Typecheck & Vite Build
        run: |
          cd frontend
          npm run build

  docker-backend:
    name: Standalone Backend Docker Build
    needs: [changes, backend-test]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Standalone Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: authentic-backend:ci-test

  docker-frontend:
    name: Standalone Frontend Docker Build
    needs: [changes, frontend-test]
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Standalone Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: authentic-frontend:ci-test

  docker-unified:
    name: Unified Stack Docker Build
    needs: [changes, backend-test, frontend-test]
    if: always() && !cancelled() && !contains(needs.*.result, 'failure') && (needs.changes.outputs.unified == 'true' || (needs.changes.outputs.backend == 'true' && needs.changes.outputs.frontend == 'true'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Unified Stack Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: authentic-et:ci-test
