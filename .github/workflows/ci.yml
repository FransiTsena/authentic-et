name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: opensource/backend/go.sum

      - name: Go Format Check
        run: |
          cd opensource/backend
          test -z $(gofmt -l .)

      - name: Run Go Unit & Conformance Tests
        run: |
          cd opensource/backend
          go test -race -v -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Verify CLI Binary Builds
        run: |
          cd opensource/backend
          go build -v -o /dev/null ./cmd/cli
          go build -v -o /dev/null ./cmd/server

  frontend-test:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: opensource/frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd opensource/frontend
          npm ci

      - name: Run TypeScript Typecheck & Vite Build
        run: |
          cd opensource/frontend
          npm run build

  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./opensource/backend
          push: false
          tags: paygate/backend:ci-test

      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./opensource/frontend
          push: false
          tags: paygate/frontend:ci-test
